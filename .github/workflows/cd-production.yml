name: CD Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          set -eu
          missing=0
          for name in SSH_HOST SSH_USER SSH_KEY; do
            if [ -z "$(eval "printf '%s' \"\${$name}\"")" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set production environment secrets PRODUCTION_SSH_HOST, PRODUCTION_SSH_USER, PRODUCTION_SSH_KEY."
            exit 1
          fi

      - name: Deploy to production via SSH
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          APP_DIR: ${{ vars.PRODUCTION_APP_DIR }}
          DEPLOY_BRANCH: main
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -eu
          : "${SSH_PORT:=22}"
          : "${APP_DIR:=/root/make-it-art}"
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "Invalid PRODUCTION_SSH_KEY secret. Check the private key content and line breaks."
            exit 1
          fi
          if ! ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/tmp/ssh-keyscan.err; then
            cat /tmp/ssh-keyscan.err >&2
            echo "Unable to reach the production VPS over SSH. Check host, port, firewall, and that the VPS is running."
            exit 1
          fi
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOF
          set -eu
          if [ ! -d "$APP_DIR/.git" ]; then
            mkdir -p "$(dirname "$APP_DIR")"
            git clone --branch "$DEPLOY_BRANCH" "$REPO_URL" "$APP_DIR"
          fi
          cd "$APP_DIR"
          git checkout "$DEPLOY_BRANCH"
          git pull --ff-only origin "$DEPLOY_BRANCH"
          if [ ! -f infrastructure/.env.production ]; then
            echo "Missing infrastructure/.env.production on the production server at $APP_DIR"
            exit 1
          fi
          docker compose --env-file infrastructure/.env.production -f infrastructure/docker-compose.prod.yml build --no-cache
          # The first deployment of this backdated migration may have recorded
          # a failed attempt before its idempotency fix. Mark only that attempt
          # as rolled back so Prisma can safely retry it.
          docker compose --env-file infrastructure/.env.production -f infrastructure/docker-compose.prod.yml run --rm --no-deps backend \
            sh -c 'npx prisma migrate resolve --rolled-back 20260726120000_artwork_ai_protection --config prisma.config.ts || true'
          if ! docker compose --env-file infrastructure/.env.production -f infrastructure/docker-compose.prod.yml up -d; then
            echo "Production containers failed to become healthy."
            docker compose --env-file infrastructure/.env.production -f infrastructure/docker-compose.prod.yml ps -a
            docker compose --env-file infrastructure/.env.production -f infrastructure/docker-compose.prod.yml logs --tail=200 --no-color backend
            docker inspect --format '{{json .State.Health}}' make-it-art-prod-backend-1 || true
            exit 1
          fi
          docker compose --env-file infrastructure/.env.production -f infrastructure/docker-compose.prod.yml ps
          EOF
