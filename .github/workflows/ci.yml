name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_WORKSPACES: "false"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend deps
        run: npm install --legacy-peer-deps --include=optional --workspaces=false --ignore-scripts --no-audit --no-fund
      - name: Frontend lint
        run: npm run lint --workspaces=false
      - name: Frontend format check
        run: npm run format:check --workspaces=false
      - name: Frontend tests and typecheck
        run: npm test --workspaces=false && npm run typecheck --workspaces=false
      - name: Frontend production dependency audit
        run: npm audit --omit=dev --audit-level=high --workspaces=false

  backend:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_WORKSPACES: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: makeitart_test
          POSTGRES_USER: mia_test
          POSTGRES_PASSWORD: test_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mia_test -d makeitart_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm
        run: npm install -g npm@12.0.1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: npm ci --ignore-scripts --no-audit --no-fund --workspaces=false
      - name: Install backend PDF dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Enforce Stripe sandbox and scan committed secrets
        run: npm run payments:validate-sandbox --workspaces=false
      - name: Backend lint
        run: npm run lint --workspaces=false
      - name: Backend format check
        run: npm run format:check --workspaces=false
      - name: Migrate test database
        env:
          DATABASE_URL: postgresql://mia_test:test_only_password@localhost:5432/makeitart_test
        run: ./node_modules/.bin/prisma migrate deploy && ./node_modules/.bin/prisma generate
      - name: Backend tests
        env:
          DATABASE_URL: postgresql://mia_test:test_only_password@localhost:5432/makeitart_test
          JWT_SECRET: ci_test_secret_not_for_production
        run: npm test --workspaces=false
      - name: Backend production dependency audit
        run: npm run security:audit --workspaces=false

  compose_config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare env file for compose
        run: cp infrastructure/.env.example infrastructure/.env
      - name: Validate compose syntax
        run: docker compose -f infrastructure/docker-compose.yml config > /dev/null
